<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up | MiniInsto</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/signup.css">

</head>

<body>

<header class="navbar">

    <div class="nav-container">

        <a href="index.html" class="logo">MiniInsto</a>
        <nav class="guest-nav">

            <a href="login.html" class="nav-login">Login</a>
            <a href="signup.html" class="nav-signup">Sign Up</a>

        </nav>

    </div>

</header>


<main class="signup-main">

    <div class="signup-card">

        <div class="signup-heading">

            <span>JOIN MININSTO</span>
            <h1>Create Your Account</h1>
            <p>Create an account to share and connect.</p>

        </div>


        <form id="signupForm">
            <div class="signup-form-group">

                <label for="signupName">Full Name</label>
                <input type="text" id="signupName" placeholder="Enter your full name" required>

            </div>


            <div class="signup-form-group">

                <label for="signupUsername">Username</label>
                <input type="text" id="signupUsername" placeholder="Choose a username" required>

            </div>


            <div class="signup-form-group">

                <label for="signupEmail">Email</label>
                <input type="email" id="signupEmail" placeholder="Enter your email" required>

            </div>


            <div class="signup-form-group">

                <label for="signupPassword">Password</label>
                <input type="password" id="signupPassword" placeholder="Create a password" required>

            </div>


            <div class="signup-form-group">

                <label for="signupConfirmPassword">Confirm Password</label>
                <input type="password" id="signupConfirmPassword" placeholder="Confirm your password" required>

            </div>


            <button type="submit" class="create-account-btn">Create Account</button>

        </form>


        <p class="login-text">

            Already have an account?

            <a href="login.html">Login</a>

        </p>

    </div>

</main>

<footer class="footer">

    <p>2026 MiniInsto. All rights reserved.</p>

</footer>


<script src="js/signup.js"></script>

</body>
</html>
