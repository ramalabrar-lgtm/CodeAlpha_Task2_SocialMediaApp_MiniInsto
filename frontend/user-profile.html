<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Profile | MiniInsto</title>
    <link rel="stylesheet" href="css/user-profile.css">

</head>

<body>

    <header class="navbar">

    <div class="nav-container">
        <a href="index.html" class="logo">MiniInsto</a>
        <nav class="user-nav" id="userNav">
            <a href="index.html" class="nav-home">

                <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9.5L12 3l9 6.5"></path><path d="M5 10v10h14V10"></path><path d="M9 20v-6h6v6"></path></svg>
                <span>Home</span>

            </a>
            <a href="explore.html" class="nav-explore">

                <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>

                <span>Explore</span>

            </a>
            <a href="explore.html?type=reels" class="nav-reels">

                <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"></rect><path d="M8 5l3 4"></path><path d="M13 5l3 4"></path><path d="M10 12l5 3-5 3v-6z"></path></svg>

                <span>Reels</span>

            </a>
            <a href="users.html" class="nav-users active">

                <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M22 21v-2a4 4 0 0 0-3-3.87"></path><path d="M16 3.13a4 4 0 0 1 0 7.75"></path></svg>
                <span>MiniInsto Users</span>

            </a>


            <a href="profile.html" class="nav-profile" id="navProfileLink">


<div class="nav-avatar" id="navAvatar">U</div>
<span>Profile</span>

</a>
            <button class="logout-btn" id="logoutBtn" type="button">Logout</button>

        </nav>
        </div>
        </header>

    <main class="profile-page">

        <a href="users.html" class="back-button">Back to Users</a>

        <section class="profile-card">

            <div class="profile-avatar" id="profileAvatar"></div>

            <h1 id="profileName"></h1>
            <p class="profile-username" id="profileUsername"></p>
            <p class="profile-bio" id="profileBio"></p>

            <div class="profile-stats">

                <div>

                    <strong id="profileFollowers">0</strong>

                    <span>Followers</span>

                </div>

                <div>

                    <strong id="profileFollowing"></strong>

                    <span>Following</span>

                </div>


            </div>

            <button id="profileFollowBtn" class="profile-follow-btn" type="button">Follow</button>


        </section>

        <section class="profile-content">

            <div class="profile-content-heading">

                <h2>Posts & Reels</h2>

                <span id="profilePosts">0</span>

            </div>

            <div class="profile-posts-grid" id="profilePostsGrid">
            </div>

            <div class="profile-no-posts" id="profileNoPosts">
                This user has not uploaded any posts or reels yet.
            </div>


        </section>


    </main>



<script src="js/usersData.js"></script>
<script src="js/exploreData.js"></script>
<script src="js/follow.js"></script>
<script src="js/user-profile.js"></script>

</body>

</html>
