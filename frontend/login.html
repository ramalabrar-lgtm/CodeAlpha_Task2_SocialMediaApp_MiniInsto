<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | MiniInsto</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/login.css">

</head>

<body>

<header class="navbar">

    <div class="nav-container">

        <a href="index.html" class="logo">MiniInsto</a>

        <nav class="guest-nav">

            <a href="login.html" class="nav-login">Login</a>
            <a href="signup.html" class="nav-signup">Sign Up</a>

        </nav>

    </div>

</header>


<main class="login-main">

    <div class="login-card">

        <div class="login-heading">

            <span>WELCOME BACK</span>

            <h1>Login to MiniInsto</h1>

            <p>Login to continue to your account.</p>

        </div>


        <form id="loginForm">

            <div class="login-form-group">

                <label for="loginEmail">Email</label>

                <input type="email" id="loginEmail" placeholder="Enter your email" required>

            </div>


            <div class="login-form-group">

                <label for="loginPassword">Password</label>

                <input type="password" id="loginPassword" placeholder="Enter your password" required>

            </div>


            <button type="submit" class="login-btn">Login</button>

        </form>


        <p class="signup-text">

            Don't have an account?

            <a href="signup.html">Sign Up</a>

        </p>

    </div>

</main>


<footer class="footer">

    <p>2026 MiniInsto. All rights reserved.</p>

</footer>


<script src="js/login.js"></script>

</body>
</html>
