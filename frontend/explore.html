
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Explore | MiniInsto</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/explore.css">

</head>


<body>

    <header class="navbar">

        <div class="nav-container">

            <a href="index.html" class="logo">MiniInsto</a>
            <nav class="user-nav">

                <a href="index.html" class="nav-home">

                    <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 10.5L12 3l9 7.5"></path><path d="M5 9.5V21h14V9.5"></path><path d="M9 21v-6h6v6"></path></svg>

                    <span>Home</span>

                </a>


                <a href="explore.html" class="nav-explore active">

                    <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-4-4"></path></svg>

                    <span>Explore</span>

                </a>


                <a href="explore.html?type=reels" class="nav-reels">

                    <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="5" width="18" height="14" rx="2"></rect><path d="M8 5l3 4"></path><path d="M13 5l3 4"></path><path d="M10 12l5 3-5 3v-6z"></path></svg>
                    <span>Reels</span>

                </a>
                <a href="users.html" class="nav-users">

                    <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M22 21v-2a4 4 0 0 0-3-3.87"></path><path d="M16 3.13a4 4 0 0 1 0 7.75"></path></svg>
                    <span>MiniInsto Users</span>

                </a>
                <a href="profile.html" class="nav-profile">

                    <span class="nav-avatar">U</span>

                    <span>Profile</span>

                </a>


                <button class="logout-btn" id="logoutBtn">Logout</button>

            </nav>

        </div>

    </header>





    <main class="explore-page">


        <section class="explore-header">

            <h1>Explore</h1>

            <p>Discover posts, photos, videos and reels from MiniInsto.</p>

        </section>

        <div class="explore-search">

            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-4-4"></path></svg>

            <input type="text" id="exploreSearch" placeholder="Search posts, people, reels..." autocomplete="off">

        </div>

        <div class="explore-filters">

            <button class="explore-filter active" data-filter="all">All</button>

            <button class="explore-filter" data-filter="post">Posts</button>

            <button class="explore-filter" data-filter="reel">Reels</button>

        </div>


        <section class="explore-grid" id="exploreGrid"></section>

        <div class="no-results" id="noResults">

            <h3>No results found</h3>

            <p>Try searching for another person, post or reel.</p>

        </div>


    </main>


    <nav class="mobile-bottom-nav" id="mobileBottomNav">

        <a href="index.html">

            <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 10.5L12 3l9 7.5"></path><path d="M5 9.5V21h14V9.5"></path></svg>

            <span>Home</span>

        </a>



        <a href="explore.html" class="active">

            <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-4-4"></path></svg>

            <span>Explore</span>

        </a>



        <button id="mobileCreateBtn">

            <span class="plus-circle">+</span>

        </button>



        <a href="explore.html?type=reels">

            <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="5" width="18" height="14" rx="2"></rect><path d="M8 5l3 4"></path><path d="M13 5l3 4"></path><path d="M10 12l5 3-5 3v-6z"></path></svg>

            <span>Reels</span>

        </a>



        <a href="profile.html">

            <span class="bottom-avatar">U</span>
            <span>Profile</span>

        </a>

    </nav>

<script src="js/usersData.js"></script>
<script src="js/exploreData.js"></script>
<script src="js/follow.js"></script>
<script src="js/like.js"></script>
<script src="js/main.js"></script>
<script src="js/explore.js"></script>


</body>

</html>
