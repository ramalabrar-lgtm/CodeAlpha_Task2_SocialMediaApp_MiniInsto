
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Profile | MiniInsto</title>

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/profile.css">

</head>


<body>

    <header class="navbar">

        <div class="nav-container">

            <a href="index.html" class="logo">MiniInsto</a>
            <nav class="user-nav">
                <a href="index.html" class="nav-home">
                    <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5L12 3l9 7.5"></path><path d="M5 9.5V21h14V9.5"></path><path d="M9 21v-6h6v6"></path></svg>

                    <span>Home</span>

                </a>
                <a href="explore.html" class="nav-explore">

                    <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-4-4"></path></svg>
                    <span>Explore</span>

                </a>
                <a href="explore.html?type=reels" class="nav-reels">

                    <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"></rect><path d="M8 5l3 4"></path><path d="M13 5l3 4"></path><path d="M10 12l5 3-5 3v-6z"></path></svg>
                    <span>Reels</span>

                </a>
                <a href="users.html" class="nav-users">

                    <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M22 21v-2a4 4 0 0 0-3-3.87"></path><path d="M16 3.13a4 4 0 0 1 0 7.75"></path></svg>
                    <span>MiniInsto Users</span>

                </a>
                <a href="profile.html" class="nav-profile active">

                    <span class="nav-avatar" id="navAvatar">U</span>
                    <span>Profile</span>

                </a>
                <button class="logout-btn" id="logoutBtn" type="button">Logout</button>

            </nav>
            <button class="menu-toggle" id="menuToggle"type="button">

                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>

            </button>

        </div>
        <div class="mobile-menu" id="mobileMenu">

            <a href="index.html">Home</a>
            <a href="explore.html">Explore</a>
            <a href="explore.html?type=reels">Reels</a>
            <a href="users.html">MiniInsto Users</a>
            <a href="profile.html" class="active">Profile</a>

            <button id="mobileLogout" type="button">Logout</button>

        </div>

    </header>


    <main class="profile-page">

        <section class="profile-header">

            <div class="profile-avatar" id="profileAvatar">U</div>


            <div class="profile-info">
                <div class="profile-name-row">

    <div class="profile-user-info">
        <h1 id="profileName">User</h1>
        <p id="profileUsername">@user</p>
    </div>

    <div class="profile-actions">

        <button type="button" class="create-profile-btn" id="createProfileBtn">+ Create</button>
        <button type="button" class="edit-profile-btn" id="editProfileBtn">Edit Profile</button>

    </div>

</div>
                <div class="profile-stats">

                    <div class="profile-stat">

                        <strong id="profilePosts">0</strong>
                        <span>Posts</span>

                    </div>

                    <button type="button" class="profile-stat profile-stat-button" id="followersButton">

                        <strong id="profileFollowers">0</strong>
                        <span>Followers</span>

                    </button>

                    <button type="button" class="profile-stat profile-stat-button" id="followingButton">

                        <strong id="profileFollowing">5</strong>
                        <span>Following</span>

                    </button>

                </div>

                <p class="profile-bio" id="profileBio"></p>
                <p class="profile-email" id="profileEmail"></p>


            </div>

        </section>

        <section class="following-section" id="followingSection" style="display: none;">

            <div class="section-heading-row">

                <h2>Following</h2>

                <button type="button" id="closeFollowingBtn">Close</button>

            </div>

            <div class="following-list" id="followingList"></div>

            <div class="following-empty" id="followingEmpty" style="display: none;">

                <h3>No following yet</h3>

                <p>Users you follow will appear here.</p>

            </div>

        </section>

        <section class="profile-content">


            <div class="profile-content-heading">

                <h2>Posts & Reels</h2>

            </div>


            <div class="profile-posts-grid" id="profilePostsGrid"></div>


            <div class="profile-no-posts" id="profileNoPosts" style="display: none;">

                <h3>No posts yet</h3>
                <p>Create your first post or reel.</p>

            </div>

        </section>


    </main>


    <nav class="mobile-bottom-nav">


        <a href="index.html">

            <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 10.5L12 3l9 7.5"></path><path d="M5 9.5V21h14V9.5"></path></svg>
            <span>Home</span>

        </a>


        <a href="explore.html">

            <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-4-4"></path></svg>
            <span>Explore</span>

        </a>


        <button id="mobileCreateBtn" type="button">

            <span class="plus-circle">+</span>

        </button>


        <a href="explore.html?type=reels">

            <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="5" width="18" height="14" rx="2"></rect><path d="M8 5l3 4"></path><path d="M13 5l3 4"></path><path d="M10 12l5 3-5 3v-6z"></path></svg>

            <span>Reels</span>

        </a>


        <a href="profile.html" class="active">

            <span class="bottom-avatar" id="bottomAvatar">U</span>

            <span>Profile</span>

        </a>

    </nav>

<script src="js/usersData.js"></script>
<script src="js/exploreData.js"></script>
<script src="js/main.js"></script>
<script src="js/profile.js"></script>


</body>

</html>
